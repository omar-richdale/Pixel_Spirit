<title>A Digital Guy in an AI World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Hanken+Grotesk:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Concept: a 52-second motion piece. The AI world is continuous (domain-warped light, silk threads,
   streaming words). The man is discrete (72x90 phosphor cells, scanlines, a DOS font). Five scenes,
   ending where the two meet in an ordered dither. Single deliberate look, so no theme switch. */
:root {
  --pearl: #dfe3e8;
  --ink: #27303b;
  --phos: #74f08e;
  --dark: #050b07;
  --term: rgba(5, 11, 7, 0.82);
  --pixel: "VT323", "IBM Plex Mono", ui-monospace, monospace;
  --smooth: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
:root[data-phosphor="amber"] { --phos: #ffb84d; --dark: #0b0805; --term: rgba(11, 8, 5, 0.82); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--pearl); color: var(--ink); overflow: hidden; font-family: var(--smooth); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fx { touch-action: none; cursor: crosshair; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--phos); outline-offset: 2px; }

.ctrl {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(820px, calc(100% - 24px));
  display: flex; align-items: stretch; gap: 2px;
  background: var(--term); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 4px; z-index: 5; transition: opacity .5s;
}
.ctrl.idle { opacity: .18; }
.ctrl.idle:hover, .ctrl.idle:focus-within { opacity: 1; }
.ctrl button {
  background: transparent; border: 0; color: var(--phos); cursor: pointer;
  font: 22px/1 var(--pixel); padding: 8px 12px; white-space: nowrap;
}
.ctrl button:hover { background: rgba(255,255,255,.06); }
.ctrl button[aria-pressed="true"] { background: var(--phos); color: var(--dark); }
.chap { flex: 1; min-width: 0; display: flex; gap: 2px; }
.chap button { position: relative; flex: var(--w) 1 0; min-width: 0; text-align: left; padding: 8px 8px 12px; overflow: hidden; text-overflow: ellipsis; color: color-mix(in srgb, var(--phos) 60%, transparent); }
.chap button.on { color: var(--phos); }
.chap button i { position: absolute; left: 0; bottom: 3px; height: 3px; width: 100%; background: color-mix(in srgb, var(--phos) 22%, transparent); }
.chap button i b { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--phos); }
.sw { display: flex; }
@media (max-width: 640px) {
  .ctrl { flex-wrap: wrap; }
  .chap { order: -1; flex-basis: 100%; }
  .chap button { font-size: 17px; padding: 6px 4px 10px; }
  .ctrl > button, .sw button { flex: 1; font-size: 19px; }
  .sw { flex: 2; }
  #fs { display: none; }
}
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" role="img" aria-label="Animated film: a man made of green phosphor pixels standing in a soft, flowing, continuous world. Move the pointer to see the world through his pixels; click to send a pixel ripple."></canvas>
<p class="sr" aria-live="polite" id="live"></p>

<div class="ctrl" id="ctrl">
  <button type="button" id="play" aria-label="Pause">Pause</button>
  <nav class="chap" id="chap" aria-label="Scenes"></nav>
  <button type="button" id="snd" aria-pressed="false">Sound</button>
  <div class="sw" role="group" aria-label="Phosphor">
    <button type="button" data-ph="green" aria-pressed="true">P1</button>
    <button type="button" data-ph="amber" aria-pressed="false">P3</button>
  </div>
  <button type="button" id="fs">Full</button>
</div>

<script>
(function () {
"use strict";
var CAPTURE = !!window.__CAPTURE;
var reduce = !CAPTURE && matchMedia("(prefers-reduced-motion: reduce)").matches;
var root = document.documentElement;

/* ---------------------------------------------------------------- data */
var C = 72, R = 90, PAD = 30, DMAX = 30;
var PORTRAIT = "..................................................................................................................................................................................................................................................................................................................................................................................................23..11................................................................1332000000222.......21.................................................1121000000000001....314................................................110100000000000000000002...............................................210000000000000000000000112............................................200000000100000000000100000012........................................21000000011000000000000000000001.....................................321100000000000000010000000000000002....................................000000000000000000000000000000000000....................................0010000100000100000000000000000000001..................................20000001000000000000000000000000000000011..............................300000000000000000000000000000000000000023121...........................20000000000000000000000000000100000000000101.21..........................000000000000000000000000010011000000000000...1..........................1000000000000000000000122233221000000000001..............................0000000000000000012333555555320000000000023.2...........................000000000000000024566666666644200000000000101..........................0000000000000122356666666666655420000000000012........................0000000000000024556666666666666655320000000000112......................0000000000000024555666666666666655543100000000011.......................200000000000135555666666666666666555420000000000.........................0000000000034555566666666666666655543100000000..........................0000000000134555666666666666 for (var i = 0; i < C * R; i++) { var ch = PORTRAIT.charCodeAt(i); LV[i] = ch === 46 ? -1 : ch - 48; }

  var D = SD, x, y, k, d;

  var s2 = 1.4142;
  for (y = 0; y < GH; y++) for (x = 0; x < GW; x++) {

    if (x > 0) d = Math.min(d, D[k - 1] + 1);
    if (y > 0) { d = Math.min(d, D[k - GW] + 1); if (x > 0) d = Math.min(d, D[k - GW - 1] + s2); if (x < GW - 1) d = Math.min(d, D[k - GW + 1] + s2); }

    if (y < GH - 1) { d = Math.min(d, D[k + GW] + 1); if (x < GW - 1) d = Math.min(d, D[k + GW + 1] + s2); if (x > 0) d = Math.min(d, D[k + GW - 1] + s2); }
    D[k] = Math.min(d, DMAX);
  }

/* ------------------------------------------------------------- timeline */
var SCENES = [
  { name: "Denoise", a: 0, b: 9 },
  { name: "Resident", a: 9, b: 19 },
  { name: "Tokens", a: 19, b: 30 },
  { name: "Rails", a: 30, b: 40 },
  { name: "Dither", a: 40, b: 52 }
];
var TOTAL = 52;
var CAPS = [
  { ai: "Everything here is smooth.", aiT: 4.3, me: "> Except me.", meT: 6.6, end: 9 },
  { ai: "Gradients, all the way down.", aiT: 10.2, me: "> I still think in steps.", meT: 12.6, end: 19 },
  { ai: "Every word is a guess.", aiT: 19.9, me: "> I read every guess.", meT: 21.9, end: 30 },
  { ai: "We act on our own now.", aiT: 30.9, me: "> On rails I laid.", meT: 33.1, end: 40 },
  { ai: "Where do we meet?", aiT: 40.7, me: "> At the dither.", meT: 42.7, end: 45.3 }
];
var MOSAIC = [[2.0, 12], [2.6, 8], [3.2, 6], [3.7, 4], [4.15, 3], [4.55, 2], [4.95, 1]];
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function sm(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
function seg(t, a, b) { return sm((t - a) / (b - a)); }
function hash(n) { var s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

function params(t) {
  var p = {};
  var n = t < 0.8 ? 1 : 1 - seg(t, 0.8, 7.4);
  n = Math.max(n, seg(t, 50.7, 51.9));
  p.noise = n;
  p.step = Math.round(1000 * Math.pow(n, 0.7));
  var k = 0, i;
  if (t >= 2) for (i = 0; i < MOSAIC.length; i++) if (t >= MOSAIC[i][0]) k = MOSAIC[i][1];
  if (t >= 50.7) { k = 1; for (i = MOSAIC.length - 1; i >= 0; i--) if (t >= 50.7 + (MOSAIC.length - 1 - i) * 0.17) k = MOSAIC[i][1]; if (t > 51.9) k = 0; }
  p.k = k;
  p.part = seg(t, 8.6, 11) * (1 - seg(t, 50.8, 51.8));
  p.log = seg(t, 20.3, 20.9) * (1 - seg(t, 29.5, 30.3));
  p.grid = seg(t, 30.6, 32.3) * (1 - seg(t, 41, 44));
  p.orb = seg(t, 31, 31.8) * (1 - seg(t, 39.5, 40.5));
  p.bridge = seg(t, 40.8, 46.2) * (1 - seg(t, 51.2, 52));
  p.title = seg(t, 45.5, 46.4) * (1 - seg(t, 50.2, 50.9));
  p.shift = seg(t, 44.4, 46.0) * (1 - seg(t, 50.6, 51.9));
  return p;
}

/* -------------------------------------------------------------- layout */
var W, H, DPR, cell, baseX, figX, figY, figW, figH, headX, headY, Q;
var gl = document.getElementById("gl"), fx = document.getElementById("fx"), g = fx.getContext("2d");
function place(shift) {
  var target = W >= 1100 ? W * 0.76 - figW / 2 : (W < 700 ? baseX : W - figW * 0.8);
  figX = Math.round(baseX + (target - baseX) * shift);
  headX = figX + (HEAD.c + 0.5) * cell; headY = figY + (HEAD.r + 0.5) * cell;
}
function layout() {
  W = innerWidth; H = innerHeight; DPR = CAPTURE ? 1 : Math.min(devicePixelRatio || 1, 2);
  var narrow = W < 700;
  cell = Math.max(3, Math.floor(narrow ? Math.min(H * 0.6 / R, W * 0.98 / C) : Math.min(H * 0.8 / R, W * 0.9 / C)));
  figW = C * cell; figH = R * cell;

  figY = H - figH;
  place(0);

  Q = CAPTURE ? 1 : (W > 900 ? Math.min(devicePixelRatio || 1, 1.5) : 1);
  gl.width = Math.round(W * Q); gl.height = Math.round(H * Q);
  figCache = {};
  initParticles();
}

/* ------------------------------------------------------------ colours */
var COL = {};
function hex(h) { var n = parseInt(h.replace("#", ""), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function readCols() {
  var cs = getComputedStyle(root);
  COL.phos = hex(cs.getPropertyValue("--phos").trim());
  COL.dark = hex(cs.getPropertyValue("--dark").trim());
  COL.ink = hex(cs.getPropertyValue("--ink").trim());
  COL.alert = [255, 92, 72];
}
function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

/* -------------------------------------------------------------- WebGL */

"precision highp float;",
"uniform vec2 uRes;uniform float uQ,uTime,uNoise,uBridge,uCell,uFrame;uniform vec2 uFigO;uniform vec3 uLens;",
"uniform vec3 uPhos,uDark;uniform sampler2D uSdf;uniform vec2 uGrid;uniform float uPad,uDmax;",
"float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
"float vn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y);}",

" c=mix(c,lilac,clamp(r.y-.55,0.,1.)*.5);",

"float bayer(vec2 a){return b2(.5*a)*.25+b2(a);}",

" vec3 c=mix(uDark,uPhos,lv*.9);",

"  if(uv.x>0.&&uv.y>0.&&uv.x<1.&&uv.y<1.)d=texture2D(uSdf,uv).r*uDmax;",
"  tq=1.-smoothstep(0.,uBridge*17.+.001,d);}",
" if(uLens.z>1.){float dl=length(px-uLens.xy);tq=max(tq,1.-smoothstep(uLens.z*.45,uLens.z,dl));}",
" if(tq>0.){vec2 cg=floor((px-uFigO)/uCell);if(tq>bayer(cg)*.98+.01)col=his(px);}",
" if(uNoise>.001){vec2 s=floor(px)+uFrame*vec2(17.3,9.1);",
"  vec3 e=vec3(h(s),h(s+31.7),h(s+71.3))+vec3(h(s+5.1),h(s+13.3),h(s+47.9))-1.;",
"  col=sqrt(1.-uNoise)*col+sqrt(uNoise)*(vec3(.62)+e*.55);}",

function initGL() {

  var bytes = new Uint8Array(GW * GH);

  GL.texParameteri(GL.TEXTURE_2D, GL.TEXTURE_WRAP_S, GL.CLAMP_TO_EDGE); GL.texParameteri(GL.TEXTURE_2D, GL.TEXTURE_WRAP_T, GL.CLAMP_TO_EDGE);

var frameNo = 0;
function drawGL(t, p) {
  if (!GL) { gl.style.background = "linear-gradient(160deg,#e9e3df,#cfd6dd 55%,#aab6c2)"; return; }
  GL.viewport(0, 0, gl.width, gl.height);
  GL.uniform2f(U.uRes, gl.width, gl.height); GL.uniform1f(U.uQ, Q);
  GL.uniform1f(U.uTime, wallT); GL.uniform1f(U.uNoise, p.noise); GL.uniform1f(U.uBridge, p.bridge);
  GL.uniform1f(U.uCell, cell); GL.uniform1f(U.uFrame, (frameNo++ % 97));
  GL.uniform2f(U.uFigO, figX, figY);
  GL.uniform3f(U.uLens, lens.x, lens.y, lens.r);
  GL.uniform3f(U.uPhos, COL.phos[0] / 255, COL.phos[1] / 255, COL.phos[2] / 255);
  GL.uniform3f(U.uDark, COL.dark[0] / 255, COL.dark[1] / 255, COL.dark[2] / 255);
  GL.uniform2f(U.uGrid, GW, GH); GL.uniform1f(U.uPad, PAD); GL.uniform1f(U.uDmax, DMAX);

  GL.drawArrays(GL.TRIANGLES, 0, 3);
}

/* -------------------------------------------------------------- figure */
var figCache = {};

  if (figCache[key]) return figCache[key];
  var cv = document.createElement("canvas"); cv.width = figW * DPR; cv.height = figH * DPR;
  var x = cv.getContext("2d"); x.scale(DPR, DPR);
  for (var by = 0; by < R; by += k) for (var bx = 0; bx < C; bx += k) {
    var sr = Math.min(R - 1, by + (k >> 1)), sc = Math.min(C - 1, bx + (k >> 1)), v = LV[sr * C + sc];
    if (v < 0) continue;
