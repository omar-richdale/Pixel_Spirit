<title>Ten Thousand Mouths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;1,400&family=Silkscreen&display=swap">
<style>
/* A pixel-art film in five chapters. The world is a 384x216 canvas scaled by whole pixels;
   all words live in crisp DOM type on top of it: Cinzel for names and cards, EB Garamond
   for speech and narration, Silkscreen for the controls. One dark world, no theme switch. */
:root {
  --void: #07060a;
  --parch: #efe6d2;
  --parch-ink: #2a2018;
  --stone: #2b2d31;
  --stone-ink: #d9d6ce;
  --gold: #c9a24a;
  --phos: #74f08e;
  --blood: #9a2222;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --prose: "EB Garamond", Garamond, Georgia, serif;
  --pixel: "Silkscreen", "Courier New", monospace;
  --s: 3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--parch); overflow: hidden; font-family: var(--prose); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#stage { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }
#c { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
#ui { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

/* speech */
.bubble {
  position: absolute; max-width: min(460px, 58%); min-width: 200px;
  font-size: clamp(15px, calc(var(--s) * 6.3px), 24px); line-height: 1.35;
  padding: .55em .8em .65em; pointer-events: none;
  opacity: 0; transition: opacity .25s;
}
.bubble.on { opacity: 1; }
.bubble .who { display: flex; align-items: center; gap: .55em; margin-bottom: .3em; }
.bubble .face { width: 2.6em; height: 2.6em; image-rendering: pixelated; flex: none; outline: 2px solid currentColor; outline-offset: 0; background: #1a1620; }
.bubble .name { font: 500 .72em/1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
.bubble p { margin: 0; text-wrap: pretty; }
.bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -12px; width: 12px; height: 12px; transform: translateX(-50%); background: inherit; clip-path: polygon(0 0, 100% 0, 50% 100%); }
.bubble.omar { background: var(--parch); color: var(--parch-ink); box-shadow: 0 0 0 3px var(--parch-ink), 0 0 0 6px var(--parch), 6px 8px 0 6px rgba(0,0,0,.35); }
.bubble.sov { background: var(--stone); color: var(--stone-ink); font-style: italic; box-shadow: 0 0 0 3px #111214, 0 0 0 6px #6b6f76, 6px 8px 0 6px rgba(0,0,0,.4); text-shadow: 2px 0 rgba(217,214,206,.16), -2px 0 rgba(217,214,206,.16), 0 2px rgba(217,214,206,.1); }
.bubble.sov .name { color: #9a9ea6; }
.bubble.husk { background: #4a4d54; color: #e3e1db; box-shadow: 0 0 0 3px #1c1d20, 0 0 0 6px #8a8e96; }
.bubble.down::after { bottom: auto; top: -12px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }

/* narration */
#narr { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); width: min(78%, 900px); text-align: center; font-style: italic; font-size: clamp(16px, calc(var(--s) * 7.4px), 30px); line-height: 1.45; color: #ece3cf; text-shadow: 0 2px 0 #000, 0 0 18px rgba(0,0,0,.9); opacity: 0; transition: opacity .9s; text-wrap: balance; margin: 0; }
#narr.on { opacity: 1; }
#narr.top { bottom: auto; top: 9%; }

/* area and title cards */
#card { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; opacity: 0; transition: opacity 1.2s; white-space: nowrap; }
#card.on { opacity: 1; }
#card h2 { margin: 0; font: 500 clamp(22px, calc(var(--s) * 13px), 54px)/1.1 var(--display); letter-spacing: .12em; color: #f1e7cf; text-shadow: 0 2px 0 #000, 0 0 24px rgba(0,0,0,.8); }
#card p { margin: .5em 0 0; font-style: italic; font-size: clamp(14px, calc(var(--s) * 6px), 22px); color: #cbbf9f; text-shadow: 0 2px 0 #000; }
#card .rule { display: block; height: 1px; margin: .55em auto; width: 70%; background: linear-gradient(90deg, transparent, #cbbf9f, transparent); }

/* boss name */
#bossname { position: absolute; left: 21.4%; bottom: 5.8%; font: 500 clamp(12px, calc(var(--s) * 5.4px), 21px)/1 var(--display); letter-spacing: .08em; color: #e9e2d0; text-shadow: 0 2px 0 #000; opacity: 0; transition: opacity .8s; white-space: nowrap; }
#bossname.on { opacity: 1; }

/* victory band */
#banner { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); padding: 1.1em 0; text-align: center; background: linear-gradient(90deg, transparent, rgba(0,0,0,.82) 18%, rgba(0,0,0,.82) 82%, transparent); opacity: 0; transition: opacity 1.4s; }
#banner.on { opacity: 1; }
#banner h2 { margin: 0; font: 700 clamp(26px, calc(var(--s) * 15px), 62px)/1 var(--display); letter-spacing: .08em; color: var(--gold); text-shadow: 0 0 22px rgba(201,162,74,.55), 0 2px 0 #000; }

/* dock for small screens */
#dock { position: fixed; left: 12px; right: 12px; display: none; flex-direction: column; gap: 12px; }
body.docked #dock { display: flex; }
body.docked .bubble { position: relative; left: auto !important; top: auto !important; max-width: none; width: 100%; }
body.docked .bubble::after { display: none; }
body.docked #narr { position: relative; left: auto; bottom: auto; transform: none; width: 100%; }
body.docked #narr.top { top: auto; }

/* controls */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: center; width: min(900px, calc(100% - 24px)); font: 11px/1 var(--pixel); opacity: .35; transition: opacity .4s; z-index: 4; }
#bar:hover, #bar:focus-within { opacity: 1; }
#bar button { background: rgba(255,255,255,.04); border: 1px solid rgba(239,230,210,.18); padding: 8px 10px; cursor: pointer; color: #d8cfba; letter-spacing: .04em; }
#bar button:hover { background: rgba(255,255,255,.1); }
#bar button[aria-current="true"] { color: var(--void); background: var(--gold); border-color: var(--gold); }
#bar .sep { width: 10px; }

/* title screen */
#title { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #16121c 0%, var(--void) 70%); padding: 24px 16px; text-align: center; }
#title[hidden] { display: none; }
#title .in { display: grid; gap: 18px; justify-items: center; max-width: 640px; }
#title h1 { margin: 0; font: 500 clamp(34px, 7vw, 76px)/1.05 var(--display); letter-spacing: .1em; color: #efe4c8; text-shadow: 0 0 30px rgba(201,162,74,.25); text-wrap: balance; }
#title .sub { margin: 0; font-style: italic; font-size: clamp(17px, 2.2vw, 22px); color: #b9ad8f; }
#title .rule { width: 60%; height: 1px; background: linear-gradient(90deg, transparent, #8a7d5e, transparent); }
#title .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
#title button { font: 500 15px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; padding: 15px 22px; cursor: pointer; background: transparent; border: 1px solid #8a7d5e; color: #efe4c8; }
#title button.main { background: #efe4c8; color: var(--void); border-color: #efe4c8; }
#title button:hover { box-shadow: 0 0 24px rgba(201,162,74,.35); }
#title .note { font: 11px/1.7 var(--pixel); color: #7d7462; max-width: 44ch; }
#title canvas { width: 96px; height: 96px; image-rendering: pixelated; }
#again { position: absolute; left: 50%; top: 74%; transform: translateX(-50%); pointer-events: auto; font: 500 14px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; padding: 13px 20px; background: transparent; border: 1px solid #8a7d5e; color: #efe4c8; cursor: pointer; }
#again[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .bubble, #narr, #card, #banner { transition: none; } }
</style>

<div id="stage">
  <canvas id="c" width="384" height="216" aria-label="Pixel-art film. Click or press Space to hurry the words."></canvas>
  <div id="ui">
    <div class="bubble" id="bub" aria-live="polite"><div class="who"><img class="face" id="bface" alt="" width="36" height="36"><span class="name" id="bname"></span></div><p id="btxt"></p></div>
    <p id="narr" aria-live="polite"></p>
    <div id="card"><h2 id="cardh"></h2><span class="rule"></span><p id="cardp"></p></div>
    <div id="bossname">The Grey Sovereign, Lord of Ten Thousand Mouths</div>
    <div id="banner"><h2>The Grey Is Lifted</h2></div>
    <button type="button" id="again" hidden>Watch again</button>
  </div>
</div>
<div id="dock"></div>

<nav id="bar" aria-label="Chapters">
  <button type="button" id="pause">Pause</button>
  <span class="sep"></span>
  <span id="chaps" style="display:contents"></span>
  <span class="sep"></span>
  <button type="button" id="mute">Sound on</button>
</nav>

<div id="title">
  <div class="in">
    <canvas id="tface" width="36" height="36" aria-hidden="true"></canvas>
    <h1>Ten Thousand Mouths</h1>
    <span class="rule"></span>
    <p class="sub">A tale of Omar, keeper of the agadir, and the lord who had no hands.</p>
    <div class="row">
      <button type="button" class="main" id="go">Begin</button>
      <button type="button" id="goq">Begin in silence</button>
    </div>
    <p class="note">About four minutes, best with sound. Click the scene or press Space to hurry the words. Chapters sit at the bottom.</p>
  </div>
</div>
